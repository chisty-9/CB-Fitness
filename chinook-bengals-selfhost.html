<style>
  :root{
    --pitch:#173620;
    --pitch-2:#20492c;
    --paper:#F3EEDF;
    --paper-2:#EAE3CE;
    --ink:#1A1A14;
    --leather:#8C1D2B;
    --leather-dark:#6b1621;
    --willow:#C7A467;
    --line:rgba(26,26,20,.18);
    --muted:#6b6a5c;
    --good:#2f6b3f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Karla',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.score,.tabbtn,.stat-num{font-family:'Bebas Neue',sans-serif; letter-spacing:.02em;}
  .header{
    background:
      repeating-linear-gradient(90deg, var(--pitch) 0px, var(--pitch) 24px, var(--pitch-2) 24px, var(--pitch-2) 48px);
    color:var(--paper);
    padding:16px 14px 0 14px;
  }
  .header-inner{
    max-width:760px;margin:0 auto;
    display:flex;justify-content:space-between;align-items:flex-end;
    padding-bottom:14px;flex-wrap:wrap;gap:10px;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .team-logo{height:42px;width:42px;object-fit:contain;border-radius:8px;background:rgba(255,255,255,.08);flex-shrink:0;}
  .brand h1{font-size:clamp(1.5rem, 6vw, 2.1rem);margin:0;line-height:1;color:var(--paper);}
  .brand p{margin:4px 0 0;font-size:.8rem;color:var(--willow);font-style:italic;}
  .clock{text-align:right;}
  .clock .score{font-size:clamp(1.9rem, 8vw, 2.6rem);line-height:1;color:var(--willow);}
  .clock .lbl{font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--paper);opacity:.75;}
  .tabs{
    max-width:760px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tabbtn{
    background:none;border:none;color:var(--paper);opacity:.6;font-size:1rem;
    padding:11px 14px 13px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;
    min-height:44px;-webkit-tap-highlight-color:transparent;
  }
  .tabbtn.active{opacity:1;border-bottom-color:var(--leather);}
  .tabbtn:hover{opacity:1;}
  main{max-width:760px;margin:0 auto;padding:18px 14px 70px;}
  @media (max-width:420px){
    main{padding:14px 10px 70px;}
    .card{padding:14px 12px;}
  }
  .card{
    background:#fffdf7;border:1px solid var(--line);border-left:4px solid var(--pitch);
    padding:16px 18px;margin-bottom:16px;
  }
  .card.red{border-left-color:var(--leather);}
  .card.tan{border-left-color:var(--willow);}
  .quote{
    background:var(--paper-2);border-left:4px solid var(--leather);
    padding:14px 16px;font-style:italic;margin-bottom:18px;font-size:1.02rem;
  }
  .quote b{font-style:normal;color:var(--leather);}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  .muted{color:var(--muted);font-size:.88rem;}
  .btn{
    font-family:'Karla',sans-serif;font-weight:700;border:2px solid var(--ink);background:var(--ink);color:var(--paper);
    padding:11px 18px;cursor:pointer;font-size:.95rem;min-height:46px;-webkit-tap-highlight-color:transparent;
  }
  .btn:hover{background:var(--leather);border-color:var(--leather);}
  .btn.outline{background:none;color:var(--ink);}
  .btn.outline:hover{background:var(--ink);color:var(--paper);}
  .btn.green{background:var(--good);border-color:var(--good);}
  .btn.green:hover{opacity:.85;background:var(--good);}
  .btn[disabled]{opacity:.4;cursor:not-allowed;}
  label{display:block;font-size:.82rem;font-weight:700;margin:12px 0 4px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);}
  select, input[type=text]{
    width:100%;padding:12px 10px;font-family:'Karla',sans-serif;font-size:16px;border:1px solid var(--line);background:#fff;min-height:46px;
  }
  @media (max-width:600px){
    .card .btn, .card .fileBtn{width:100%;text-align:center;}
    .row > .btn, .row > .fileBtn{width:auto;}
  }
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .day-title{font-size:1.5rem;margin:0 0 2px;}
  .day-num{display:inline-block;background:var(--pitch);color:var(--paper);width:26px;height:26px;text-align:center;line-height:26px;border-radius:50%;font-family:'Bebas Neue';font-size:1rem;margin-right:8px;}
  .ex{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);}
  .ex:first-of-type{border-top:none;}
  .ex input[type=checkbox]{margin-top:2px;width:24px;height:24px;accent-color:var(--good);flex-shrink:0;}
  .ex .exname{font-weight:700;}
  .ex .exname.done{text-decoration:line-through;color:var(--muted);}
  .exdetail{font-size:.86rem;color:var(--muted);}
  .swap-tag{display:inline-block;background:var(--willow);color:var(--ink);font-size:.68rem;font-weight:700;text-transform:uppercase;padding:1px 6px;margin-left:6px;letter-spacing:.03em;}
  .lookup{font-size:.78rem;margin-left:8px;white-space:nowrap;}
  .progress{background:var(--line);height:8px;width:100%;margin:8px 0 2px;}
  .progress > div{background:var(--good);height:100%;}
  .badge{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;}
  .badge.on{background:var(--good);}
  .badge.off{background:#ccc;}
  .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -18px;padding:0 18px;}
  @media (max-width:420px){ .table-wrap{margin:0 -12px;padding:0 12px;} }
  table{width:100%;border-collapse:collapse;font-size:.88rem;min-width:480px;}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap;}
  th{font-family:'Bebas Neue';font-weight:400;letter-spacing:.04em;color:var(--muted);font-size:.85rem;}
  .photo-row{display:flex;gap:10px;margin-top:10px;}
  .photo-row img{width:70px;height:70px;object-fit:cover;border:1px solid var(--line);}
  .fileBtn{display:inline-block;}
  .fileBtn input{display:none;}
  .onboard-wrap{max-width:460px;margin:40px auto;padding:0 18px;}
  .link{background:none;border:none;color:var(--leather);text-decoration:underline;cursor:pointer;font-family:'Karla';font-size:.85rem;padding:0;}
  a.link{display:inline-block;}
  .disclaimer{font-size:.78rem;color:var(--muted);margin-top:20px;border-top:1px dashed var(--line);padding-top:10px;}
  .who{font-size:.8rem;color:var(--willow);}
  .streakbox{text-align:center;}
  .streakbox .score{font-size:2.3rem;color:var(--leather);line-height:1;}
  .empty{color:var(--muted);font-style:italic;padding:12px 0;}
</style>
</head>

/* ---------------- STORAGE ----------------
   "shared" data (roster, check-ins, weekly checklists) lives in
   Firestore so every player's phone sees the same data.
   "personal" data is just which player YOU are on THIS phone —
   that stays in the phone's own browser storage (localStorage),
   no need to put it in the cloud.
------------------------------------------- */
const Store = {
  async get(key, shared){
    try{
      if(!shared){ const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; }
      const doc = await db.collection('kv').doc(key).get();
      return doc.exists ? JSON.parse(doc.data().value) : null;
    } catch(e){ console.error('Store.get failed', key, e); return null; }
  },
  async set(key, value, shared){
    try{
      if(!shared){ localStorage.setItem(key, JSON.stringify(value)); return true; }
      await db.collection('kv').doc(key).set({ value: JSON.stringify(value) });
      return true;
    } catch(e){ console.error('Store.set failed', key, e); return false; }
  },
  async listKeys(prefix, shared){
    try{
      if(!shared) return [];
      const end = prefix + '\uf8ff';
      const snap = await db.collection('kv')
        .where(firebase.firestore.FieldPath.documentId(), '>=', prefix)
        .where(firebase.firestore.FieldPath.documentId(), '<=', end)
        .get();
      return snap.docs.map(d => d.id);
    } catch(e){ console.error('Store.listKeys failed', prefix, e); return []; }
  }
};

/* ---------------- HELPERS ---------------- */
function uid(){ return 'p' + Math.random().toString(36).slice(2,10); }
function todayStr(d){ d = d || new Date(); return d.toISOString().slice(0,10); }
function isoWeekKey(d){
  d = d || new Date();
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = (date.getUTCDay()+6)%7;
  date.setUTCDate(date.getUTCDate()-dayNum+3);
  const firstThursday = new Date(Date.UTC(date.getUTCFullYear(),0,4));
  const week = 1+Math.round(((date-firstThursday)/86400000-3+((firstThursday.getUTCDay()+6)%7))/7);
  return date.getUTCFullYear()+'-W'+String(week).padStart(2,'0');
}
function weekVariantIdx(){
  const wk = isoWeekKey();
  const num = parseInt(wk.split('W')[1], 10) || 0;
  return num % 2;
}
function seededPick(arr, seed){
  let h = 0; for(let i=0;i<seed.length;i++){ h = (h*31 + seed.charCodeAt(i)) >>> 0; }
  return arr[h % arr.length];
}
function daysUntilNets(){
  const now = new Date();
  let target = new Date(now.getFullYear(), 3, 1); // April 1
  if(now > target) target = new Date(now.getFullYear()+1, 3, 1);
  return Math.ceil((target - now) / 86400000);
}
function resolveExercise(slot, injury, ageGroup, weekIdx){
  const variant = slot.variants[weekIdx % slot.variants.length];
  const hasShoulder = injury === 'shoulder' || injury === 'both';
  const hasKnee = injury === 'knee' || injury === 'both';
  if(variant.tag === 'knee' && hasKnee && KNEE_SWAPS[variant.name]){
    return {name: variant.name, detail: KNEE_SWAPS[variant.name], swapped:'injury', type:'fixed'};
  }
  if(variant.tag === 'shoulder' && hasShoulder && SHOULDER_SWAPS[variant.name]){
    return {name: variant.name, detail: SHOULDER_SWAPS[variant.name], swapped:'injury', type:'fixed'};
  }
  if(variant.impact && ageGroup === '35+' && AGE_IMPACT_SWAPS[variant.name]){
    return {name: variant.name, detail: AGE_IMPACT_SWAPS[variant.name], swapped:'age', type:'fixed'};
  }
  return {name: variant.name, detail: variant.detail || '', swapped:false, type: variant.type};
}
function compressImage(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const maxW = 480;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.6));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

  const p = { id: uid(), name: name.trim(), role, ageGroup, injury, isAdmin: S.roster.length === 0, joinedAt: todayStr() };

  await Store.set('roster', S.roster, true);

  const photo = await compressImage(file);

  await Store.set(`checkin:${S.me.id}:${todayStr()}`, rec, true);
  S.todayCheckin = rec;
  render();

async function handleCheckOut(fileInput){
  const file = fileInput.files[0];

  const photo = await compressImage(file);
  S.todayCheckin.outTime = new Date().toISOString();
  S.todayCheckin.outPhoto = photo;
  await Store.set(`checkin:${S.me.id}:${todayStr()}`, S.todayCheckin, true);

}

async function toggleExercise(dayIdx, exIdx){
  const key = dayIdx + '-' + exIdx;
  const set = new Set(S.weekCache.checked || []);
  if(set.has(key)) set.delete(key); else set.add(key);
  S.weekCache.checked = Array.from(set);
  await Store.set(`weekdone:${S.me.id}:${isoWeekKey()}`, S.weekCache, true);
  render();
}

async function computeStreak(playerId){
  const keys = await Store.listKeys(`checkin:${playerId}:`, true);
  const dates = new Set(keys.map(k=>k.split(':')[2]));
  let streak = 0;
  let cur = new Date();
  while(true){
    const ds = todayStr(cur);
    if(dates.has(ds)){ streak++; cur.setDate(cur.getDate()-1); }
    else break;
  }
  return streak;
}
async function weeklySessionCount(playerId){
  const keys = await Store.listKeys(`checkin:${playerId}:`, true);
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-6);
  return keys.filter(k=>{
    const ds = k.split(':')[2];
    return new Date(ds) >= new Date(todayStr(cutoff));
  }).length;
}

async function openAdminPlayer(id){
  S.adminSel = id;
  const keys = await Store.listKeys(`checkin:${id}:`, true);
  const dates = keys.map(k=>k.split(':')[2]).sort().reverse().slice(0,10);
  const records = [];
  for(const d of dates){
    const r = await Store.get(`checkin:${id}:${d}`, true);
    if(r) records.push(r);
  }
  S.adminSelData = records;
  render();
}

      </table></div>
    </div>
    <p class="disclaimer">Visible to the whole squad — this app has no login wall, so treat it as a shared team space.</p>
  `;
}

function renderAdminLoading(){
  return `
    <div class="card">
      <h3 style="margin-top:0;">Squad roster</h3>
      <div class="table-wrap"><table>
        <tr><th>Player</th><th>Role / Age</th><th>Niggle</th><th>Admin</th><th></th></tr>
        ${S.roster.map(p=>`
          <tr>
            <td>${esc(p.name)}</td>
            <td>${esc(p.role)} · ${AGE_GROUPS.find(a=>a.id===p.ageGroup).label}</td>
            <td>${INJURIES.find(i=>i.id===p.injury).label}</td>
            <td>${p.isAdmin?'Yes':'No'}</td>
            <td>
              <button class="link" data-admintoggle="${p.id}">${p.isAdmin?'Remove admin':'Make admin'}</button>
              &nbsp;·&nbsp;
              <button class="link" data-adminview="${p.id}">View log</button>
            </td>
          </tr>`).join('')}
      </table></div>
    </div>
    ${S.adminSel ? renderAdminDetail() : ''}
  `;
}
function renderAdminDetail(){
  const p = S.roster.find(r=>r.id===S.adminSel);
  if(!p) return '';
  const recs = S.adminSelData || [];
  return `
    <div class="card tan">
      <h3 style="margin-top:0;">${esc(p.name)}'s recent gym log</h3>
      ${recs.length===0 ? '<p class="empty">No check-ins logged yet.</p>' : recs.map(r=>`
        <div style="margin-bottom:12px;">
          <p class="muted" style="margin:0 0 4px;">${r.date} — in ${new Date(r.inTime).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}${r.outTime?', out '+new Date(r.outTime).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):''}</p>
          <div class="photo-row"><img src="${r.inPhoto}">${r.outPhoto?`<img src="${r.outPhoto}">`:''}</div>
        </div>`).join('')}
    </div>
  `;
}

function attachShellHandlers(){
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ S.view=b.dataset.tab; S.adminSel=null; render(); });
  document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{ S.view=b.dataset.goto; render(); });
  const sw = document.getElementById('switchBtn'); if(sw) sw.onclick = switchPlayer;

  if(S.view==='dashboard'){
    computeStreak(S.me.id).then(n=>{
      const el = document.getElementById('streakHolder');
      if(el) el.innerHTML = `<div class="score">${n}🔥</div><div class="muted">day streak</div>`;
    });
  }
  if(S.view==='plan'){
    document.querySelectorAll('.ex input[type=checkbox]').forEach(cb=>{
      cb.onchange = () => toggleExercise(cb.dataset.day, cb.dataset.ex);
    });
  }
  if(S.view==='gym'){
    const inF = document.getElementById('inFile'); if(inF) inF.onchange = () => handleCheckIn(inF);
    const outF = document.getElementById('outFile'); if(outF) outF.onchange = () => handleCheckOut(outF);
  }
  if(S.view==='admin'){
    document.querySelectorAll('[data-admintoggle]').forEach(b=>b.onclick=()=>toggleAdmin(b.dataset.admintoggle));
    document.querySelectorAll('[data-adminview]').forEach(b=>b.onclick=()=>openAdminPlayer(b.dataset.adminview));
  }
}

boot();
</script>
</body>
</html>
